CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# A control-only CDC interface lets the flasher reboot this peripheral over USB.
# It does not make the left half the host-facing keyboard or change split roles.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Charybdis Left"
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CHARYBDIS_USB_FLASH=y