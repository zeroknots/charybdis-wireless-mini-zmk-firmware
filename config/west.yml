manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    - name: 280Zo
      url-base: https://github.com/280Zo

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: edf5c0814fd3ea202e43aad2d68fd32e882a518c # v0.3.0, 2025-08-01
      clone-depth: 1
      import:
        file: app/west.yml
        # The nRF52840 keyboard does not need other vendors' HALs or host tools.
        name-allowlist:
          - zephyr
          - cmsis
          - hal_nordic
          - segger
          # ZMK 0.3 references LVGL Kconfig symbols even with displays disabled.
          - lvgl
          - tinycrypt
          - nanopb
          - zmk-studio-messages

    - name: zmk-pmw3610-driver
      remote: 280Zo
      revision: 14d39b7a6944d1014544a2382707b14724c22f49 # 2025-07-15

  self:
    path: config